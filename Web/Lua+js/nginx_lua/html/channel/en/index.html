function PostChannelURL(url, channel, bodyvalue) {
	PostURL(url, channel + ' ' + bodyvalue);
	//console.log(url + "&c=" + channel + '&' + bodyvalue, "");
	//console.log(channel + ' ' + bodyvalue);
}

var xmlpost = null;
function PostURL(url, bodyvalue) {
	console.log(url);
	if (xmlpost == null) {
		if (window.XMLHttpRequest) {
			xmlpost = new XMLHttpRequest(); 
		}
		else{
			xmlpost = new ActiveXObject("Microsoft.XMLHTTP");
		}
	}
	xmlpost.open("POST", url, false);
	xmlpost.setRequestHeader("Content-Type", "text/plain");
	xmlpost.send(bodyvalue);
}

var xmlhttpsettings = null;
function loadXMLSettings(url) {
	//console.log(url);
	if (xmlhttpsettings == null) {
		if (window.XMLHttpRequest) {
			xmlhttpsettings = new XMLHttpRequest();
		}
		else {
			xmlhttpsettings = new ActiveXObject("Microsoft.XMLHTTP");
		}
	}

	xmlhttpsettings.onreadystatechange = function() {
		if ((xmlhttpsettings.readyState == 4) && (xmlhttpsettings.status==200)) { 
			var arr = xmlhttpsettings.response; 
			if(arr == null) return;
			//console.log(arr);
			var channels = arr.chs;
			//console.log(channels);
			if (channels) {
				var jsonData = JSON.parse(channels);
				//console.log(jsonData.length);
				if(jsonData.length > 0) {
					for (var i = 0; i < jsonData.length; i++) {
						var val = jsonData[i];
						//console.log("id:" + val.id + ", cn:" + cn);
						if (val.id == cn) {
							//console.log("cool!");
							var sCh = document.getElementById("ChannelTitle");
							if (sCh) {
								sCh.innerHTML = val.title; 
							}
							break;
						}
					}
				}
				else { // we have specific answer that contains only this channel
					//console.log("here!");
					if (jsonData.id == cn) {
						//console.log("cool!");
						var sCh = document.getElementById("ChannelTitle");
						if (sCh) {
							sCh.innerHTML = jsonData.title; 
						}
					}
				}
			}
			
			// channel settings
			// set up the promo switcher
			var csettings = arr.cs;
			//console.log(csettings);
			if (csettings) {
				var jData = JSON.parse(csettings);
				//console.log(jData);
				
				if(jData.blockpromo && promoBlocked != jData.blockpromo) { 
					//console.log("here!");
					promoBlocked = jData.blockpromo;
					//console.log(promoBlocked);
					
					var btnid;
					if(promoBlocked == 1) {
						btnid = "promooff";
					}
					else {
						btnid = "promoon";
					}
					//console.log(btnid);
					var btn = document.getElementById(btnid);
					if (btn) {
						btn.checked = true;
					}
					switchBlockPromo(promoBlocked);
				}
				
				if(jData.winbefore) { 
					nWBefore = jData.winbefore;
					var wb  = document.getElementById("winBefore");
					if (wb) { wb.value = nWBefore; }
				}
				if(jData.winafter) {
					nWAfter = jData.winafter;
					var wa  = document.getElementById("winAfter");
					if (wa) { wa.value = jData.winafter; }
				}
			}
		}
	};

	xmlhttpsettings.open("GET", url, true);
	xmlhttpsettings.setRequestHeader("Cache-Control", "no-cache"); 
	xmlhttpsettings.responseType='json';
	xmlhttpsettings.send("");  
}

function checkTime(i) {
  if (i < 10) {
    i = "0" + i;
  }
  return i;
}

function startTime() {
  var today = new Date();
  var h = today.getHours();
  var m = today.getMinutes();
  var s = today.getSeconds();
	
  // add a zero in front of numbers<10
  m = checkTime(m);
  s = checkTime(s);
	
  document.getElementById('ctime').innerHTML = h + ":" + m + ":" + s;
  document.getElementById('cdate').innerHTML = today.getDate() + "/" + (today.getMonth()+1)  + "/" + today.getFullYear();

  t = setTimeout(function() { startTime() }, 500);
	
	if(promoBlocked == 1) return;
	//console.log(promoBlocked);
	var elTbl = document.getElementById("atbl");
	//console.log(elTbl);
	<!-- var x = elTbl.rows.length; -->
	<!-- console.log(x); -->
	var bFound = false;
	var timeTo = document.getElementById('countdown');
		//console.log(promoBlocked);
		
	
	var bItems = false;
	if((elTbl == null) || elTbl.rows.length < 0) return;
	for (var i = 0; i < elTbl.rows.length - 1; i++) {
		var crow = elTbl.rows[i];
		var rowid = crow.getAttribute('id');
		//console.log("rowId:" + rowid);
		if(crow.id == "mainlist") {
			bItems = true;
			continue;
		}
		else if (!bItems) {
			continue;
		}
		
		var cells = crow.cells;
		var dateControl = document.getElementById('curDate');
		var cday = dateControl.value.split('-');
		
		var ctime = cells[1].innerHTML.split(':');
		var itemTime = new Date(cday[0], cday[1] - 1, cday[2], ctime[0], ctime[1], ctime[2]);
		
		var itemTime_ms = itemTime.getTime();
		var now_ms      = today.getTime();
		
		var nWBefore_ms = nWBefore * 1000;
		var nWAfter_ms  = nWAfter * 1000;
		
		if(itemTime_ms + nWAfter_ms < today) continue;
		
		currentAnchor = cells[1].innerHTML;
	
		var diff = 0;
		var sSign = "";
		//console.log(itemTime_ms);
		//console.log(now_ms);
		if(itemTime_ms < now_ms) {
			sSign = "-";
			diff = now_ms - itemTime_ms;
		}
		else {
			diff = itemTime_ms - now_ms;
		}
		
		bFound  = true;
//take out milliseconds

		diff = diff/1000;
		var tdiff = diff;
		var seconds = Math.floor(diff % 60);
		diff = diff/60; 
		var minutes = Math.floor(diff % 60);
		diff = diff/60; 
		var hours = Math.floor(diff % 24);  
		var days = Math.floor(diff/24);
		
		//var aMinute = 1 * 60 * 60 + 42 * 60;
		var aMinute = 1 * 60 * 60;
		var setItRed = tdiff < aMinute;
		
		if(promoBlocked == null) {
			timeTo.innerHTML = "";
		}
		else if(promoBlocked == 1) {
			timeTo.innerHTML = "<Promo blocked>";
			timeTo.style.color = "#ff0000";
		}
		else {
			if(timeTo) {
				timeTo.innerHTML = sSign + ("0" + hours).slice(-2) + ":" + ("0" + minutes).slice(-2) + ":" + ("0" + seconds).slice(-2);
			}
			if(setItRed) {
				timeTo.style.color = "#ff0000";
			}
			else {
				timeTo.style.color = "#000000";
			}
		}
		
		//var cday = dateControl.value.split('-');
		
		break;
		
		
		//console.log("id[" + i + "]:" + crow.id);
		
		//console.log("s:" + val.s + ", title:" + val.t);
		// append proper line to the table
	
		<!-- var x = elTbl.rows.length; -->
		<!-- var raw = elTbl.rows[x - 1]; -->
		<!-- //console.log("raw:" + raw.innerHTML); -->
		<!-- var aa = raw.innerHTML; -->
	}
	//console.log(bFound);
	if(!bFound && timeTo) {
		currentAnchor = "";
		timeTo.innerHTML = "";
	}
}

function switchBlockPromo(blockIt) {
	//console.log(1);
	if (xmlhttpsettings) {
		xmlhttpsettings.abort();
		console.log('xmlhttpsettings.abort()');
	}
	var rowPromoSwitcher = document.getElementById("promoswitcher");
	//console.log(rowPromoSwitcher);
	if(rowPromoSwitcher != null) {
		var cellPromoIndicator = document.getElementById("promoindicator");
		if(cellPromoIndicator != null) {
			//console.log("cellPromoIndicator.class(0) = ", cellPromoIndicator.className);
			var bkColor;
			var indText;
			var idClass;
			promoBlocked = blockIt;
			if(promoBlocked == 0) { // the promo is ON
				bkColor = bkGreen;
				indText = "<h1>Promo is ON</H1>";
				idClass = "";
				console.log("Promo switch to ON");
			}
			else {
				bkColor = bkRed;
				indText = "<h1>Promo is OFF</H1>";
				idClass = "blink";
				console.log("Promo switch to OFF");
			}
			rowPromoSwitcher.style.backgroundColor = bkColor;
			cellPromoIndicator.className = idClass;
			cellPromoIndicator.innerHTML = indText;
			//console.log('promoBlocked=' + promoBlocked);
			
			//PostChannelURL('/sendcmd?id=', 1, 'blockpromo=' + promoBlocked);
			//PostChannelURL('/setchannelsettings?id=', 1, 'blockpromo=' + promoBlocked);
			PostURL('/setchannelsettings?c=' + 1 + '&blockpromo=' + promoBlocked);
			//console.log('/setchannelsettings?c=' + 1 + '&blockpromo=' + promoBlocked);
			
			// disable start buttons for all items
			var disbld = promoBlocked == 1;
			
			// main button
			var mainBt = document.getElementById("startNextBlock");
			if(mainBt) {
				mainBt.disabled = disbld;
			}
			
			var elTbl = document.getElementById("atbl");
			if((elTbl == null) || elTbl.rows.length < 0) return;
			for (var i = 0; i < elTbl.rows.length - 1; i++) {
				var btn = document.getElementById("btn_" + i);
				if(btn) {
					btn.disabled = disbld;
				}
			}
		}
	}
}

function switchShowAnchorsOnly() {
	showAllItems = !showAllItems;
	var bMainList = false;

	var elTbl = document.getElementById("atbl");
	if((elTbl == null) || elTbl.rows.length < 0) return;
	for (var i = 0; i < elTbl.rows.length - 1; i++) {
		var crow = elTbl.rows[i];
		var rowid = crow.getAttribute('id');
		if(crow.id == "mainlist") {
			bMainList = true;
			continue;
		}
		else if (!bMainList) {
			continue;
		}
		else {
			if(showAllItems) {
				crow.style.display = "";
			}
			else {
				if(crow.cells[0].innerHTML == "") {
					crow.style.display = "none";
				}
			}
		}
	}
}
