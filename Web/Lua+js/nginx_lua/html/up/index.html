var xmlDelHTTP=null;
var xmlhttpsettings=null;

function deleteClip(aFileName) {

	if((id == null) || (id <= 0)) return;
	
	//console.log(id + ": " + aFileName);
	
	if (xmlDelHTTP==null) {
		if (window.XMLHttpRequest) {
			xmlDelHTTP=new XMLHttpRequest();
		}
		else {
			xmlDelHTTP=new ActiveXObject("Microsoft.XMLHTTP");
		}
	}
	
	xmlDelHTTP.onreadystatechange = function() {
		if ((xmlDelHTTP.readyState == 4) && (xmlDelHTTP.status==200)) { 
			var arr = xmlDelHTTP.response; 
			//console.log(arr);
			var jsonData = JSON.parse(arr);
			for (fileName in jsonData) {
				var dVal = jsonData[fileName];
				//console.log(fileName);
				//console.log(dVal);
				var jsonData2 = JSON.parse(dVal);
				var noError = true;
				for (dVar2 in jsonData2) {
					var dVal2 = jsonData2[dVar2];
					if((dVar2 == "md5") && (dVal2 != 2)) {
						noError = false;
						break;
					}
					else if((dVar2 == "f") && (dVal2 != 2)) {
						noError = false;
						break;
					}
					else if((dVar2 == "db") && (dVal2 != 0)) {
						noError = false;
						break;
					}
				}
				//console.log(noError);
				if(noError) { // find the line in table and delete it!
					table = document.getElementById("clipstbl");
					tr = table.getElementsByTagName("tr");

					// Loop through all table rows, and hide those who don't match the search query
					for (i = 2; i < tr.length; i++) {
						td = tr[i].getElementsByTagName("td")[titleCol];
						if (td) {
							txtValue = td.textContent || td.innerText;
							//console.log(txtValue);
							if (txtValue == fileName) {
								table.deleteRow(i);
								break;
							}
						} 
					}
				}
			} 
		}
	};

	xmlDelHTTP.open("POST", "/deleteclips/?id=" + id, true);
	xmlDelHTTP.setRequestHeader("Content-Type", "text/plain");
	xmlDelHTTP.send(aFileName);
}
	
function initPage() {
	var stuffLink = document.getElementById("toStuffLink");
	if(stuffLink) {
		var aa = stuffLink.innerHTML;
		stuffLink.innerHTML = aa.replace(/KEYID/g, id, 'g');
	}

	var chkb = document.getElementById("ignoreloadedchkb");
	if(chkb) {
		//console.log(chkb.checked);
		chkb.checked = true;
	}
	
	if(id && (id != "")) {
		//console.log('/loadstationclips?c=' + id);
		loadClips('/loadstationclips?id=' + id);
	}
}
	
	function findGetParameter(parameterName) {
		var result = null, tmp = [];
		var items = location.search.substr(1).split("&");
		for (var index = 0; index < items.length; index++) {
			tmp = items[index].split("=");
			if (tmp[0] === parameterName) result = decodeURIComponent(tmp[1]);
		}
		return result;
	}
	
	function OnLoad() { 
		//console.log("1");
		id = "";
		var cmd = findGetParameter("id");
		if(cmd) {
		//console.log(cmd);
		//cmd = cmd.replace("?", "");
			var allkeys = cmd.split(",");
			if(allkeys) {
			id = allkeys[0];
			}
		}
		//id = "";
		//console.log(id);
		initPage();
	}
	
function filterItOut() {
  // Declare variables 
  var input, filter, table, tr, td, i, txtValue;
  input = document.getElementById("clipFilter");
  filter = input.value.toUpperCase();
  table = document.getElementById("clipstbl");
  tr = table.getElementsByTagName("tr");

  // Loop through all table rows, and hide those who don't match the search query
  for (i = 2; i < tr.length; i++) {
    td = tr[i].getElementsByTagName("td")[titleCol];
    if (td) {
      txtValue = td.textContent || td.innerText;
      if (txtValue.toUpperCase().indexOf(filter) > -1) {
        tr[i].style.display = "";
      } else {
        tr[i].style.display = "none";
      }
    } 
  }
}	

function checkVisibles() {
	var mainChkb = document.getElementById("checkAllBtn");
	if(mainChkb) {
		var bState = mainChkb.checked;
		//console.log(bState);
		var input, filter, table, tr, td, i, txtValue;
		table = document.getElementById("clipstbl");
		tr = table.getElementsByTagName("tr");

		// Loop through all table rows, and hide those who don't match the search query
		for (i = 2; i < tr.length; i++) {
			if(tr[i].style.display != "none") {
				td = tr[i].getElementsByTagName("td")[chkbCol];
				if (td) {
					var chkb = td.firstElementChild;
					if(chkb) {
						//console.log(chkb);
						chkb.checked = bState;
					}
				}
			}
		}
	}
}	

function deleteCheckedClips() {
	var input, filter, table, tr, td, i, txtValue;
	table = document.getElementById("clipstbl");
	tr = table.getElementsByTagName("tr");
	var fileNames = "";
	// Loop through all table rows, and hide those who don't match the search query
	for (i = 2; i < tr.length; i++) {
		if(tr[i].style.display != "none") {
			td = tr[i].getElementsByTagName("td")[chkbCol];
			if (td) {
				var chkb = td.firstElementChild;
				if(chkb) {
					//console.log(chkb);
					if(chkb.checked) {
						td = tr[i].getElementsByTagName("td")[titleCol];
						if (td) {
							txtValue = td.textContent || td.innerText;
							//fileNames = fileNames
							if(fileNames != "") fileNames = fileNames + "\r\n" 
							fileNames = fileNames + txtValue;
						}
					}
				}
			}
		}
	}
	//console.log(fileNames);
	deleteClip(fileNames);
	var mainChkb = document.getElementById("checkAllBtn");
	if(mainChkb) {
		mainChkb.checked = false;
	}
}

	</script>

<script>
// ************************ Drag and drop ***************** //
let dropArea = document.getElementById("drop-area")

// Prevent default drag behaviors
;['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
  dropArea.addEventListener(eventName, preventDefaults, false)   
  document.body.addEventListener(eventName, preventDefaults, false)
})

// Highlight drop area when item is dragged over it
;['dragenter', 'dragover'].forEach(eventName => {
  dropArea.addEventListener(eventName, highlight, false)
})

;['dragleave', 'drop'].forEach(eventName => {
  dropArea.addEventListener(eventName, unhighlight, false)
})


// Handle dropped files
dropArea.addEventListener('drop', handleDrop, false)

function preventDefaults (e) {
  e.preventDefault()
  e.stopPropagation()
}

function highlight(e) {
  dropArea.classList.add('highlight')
}

function unhighlight(e) {
  dropArea.classList.remove('active')
}

function handleDrop(e) {
  var dt = e.dataTransfer
  var files = dt.files
  handleFiles(files)
}

let uploadProgress = []
let progressBar = document.getElementById('progress-bar')

let bToShow = false;

function initializeProgress(numFiles) {
  progressBar.value = 0
  uploadProgress = []

  for(let i = numFiles; i > 0; i--) {
    uploadProgress.push(0)
  }
}

function updateProgress(fileNumber, percent) {
  uploadProgress[fileNumber] = percent
  let total = uploadProgress.reduce((tot, curr) => tot + curr, 0) / uploadProgress.length
  console.debug('update', fileNumber, percent, total)
  progressBar.value = total
	console.log(total)
/*	
	if(total == 100) {
		if(bToShow) { 
			window.alert("Сервер сообщает о завершении загрузки. Пожалуйста, перезагрузите страницу.")
		}
		else {
			bToShow = true;
		}
	}
*/	
}

function handleFiles(files) {
  files = [...files]
	//console.log(files.length)
  initializeProgress(files.length)
  files.forEach(uploadFile)
}

function uploadFile(file, i) {
  //var url = 'https://api.cloudinary.com/v1_1/joezimim007/image/upload'
	//var url = '/uploadclips/?c=1';
	var url = '/uploadclips/?id=' + id;
	
	//console.log(file.name)
	
	// search for an existing file name
	var chkb = document.getElementById("ignoreloadedchkb");
	if(chkb) {
		//console.log(chkb.checked);
		if(chkb.checked) {
			var tbl = document.getElementById("clipstbl");
			if(tbl) {
				//console.log("tbl");
				var nameFound = false;
				tr = tbl.getElementsByTagName("tr");
				// Loop through all table rows, and hide those who don't match the search query
				for (var pp = 2; pp < tr.length; pp++) {
					td = tr[pp].getElementsByTagName("td")[titleCol];
					if (td) {
						txtValue = td.textContent || td.innerText;
						//console.log(txtValue);
						if (txtValue == file.name) {
							nameFound = true;
							break;
						}
					} 
				}
				//console.log(file.name + " found: " + nameFound);
				if(nameFound) { // we don't need it to be uploaded
					return;
				}
			}
		}
	}

	
  var xhr = new XMLHttpRequest()
  var formData = new FormData()
  xhr.open('POST', url, true)
  xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest')

  // Update progress (can be used to show progress indicator)
  xhr.upload.addEventListener("progress", function(e) {
    updateProgress(i, (e.loaded * 100.0 / e.total) || 100)
  })

  xhr.addEventListener('readystatechange', function(e) {
    if (xhr.readyState == 4 && xhr.status == 200) {
      updateProgress(i, 100) // <- Add this
			//console.log(file.name + " loaded")
			//console.log(xhr.response);
			var items = xhr.response.split(":");
			//console.log(items[0]);
			//console.log(items[1]);
			if(items[1].trim() != "") {
				appendClipToTable(items[0], items[1]);
			}
	
	/*
			for (var index = 0; index < items.length; index++) {
				tmp = items[index].split("=");
				if (tmp[0] === parameterName) result = decodeURIComponent(tmp[1]);
			}
			return result;
*/			
    }
    else if (xhr.readyState == 4 && xhr.status != 200) {
      // Error. Inform the user
    }
  })

  //formData.append('upload_preset', 'ujpu6gyk')
  formData.append('file', file)
  xhr.send(formData)
}
