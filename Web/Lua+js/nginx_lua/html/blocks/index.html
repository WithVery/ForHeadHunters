function PostChannelURL(url, channel, bodyvalue) {
	//console.log(bodyvalue);
	PostURL(url, channel + ' ' + bodyvalue);
}

function PostURL(url, bodyvalue) {
	//console.log("url: " + url);
	if (xmlpost == null) {
		if (window.XMLHttpRequest) {
			xmlpost = new XMLHttpRequest(); 
		}
		else{
			xmlpost = new ActiveXObject("Microsoft.XMLHTTP");
		}
	}
	xmlpost.open("POST", url, false);
	xmlpost.setRequestHeader("Content-Type", "text/plain");
	xmlpost.send(bodyvalue);
}

function loadXMLDoc(url) {

		}

	var channels = arr.chs;

   var ggg = document.getElementById("status" + destkey);

					<!-- else -->

					var pd = ddd.parentElement;

							if(arr.siglvl[j] == 100) {

							}

								pd.style.backgroundColor = signalRed;
							}

							pd.style.backgroundColor = signalRed;
						}
						//pd.innerHTML = "as";
						//pd.style.backgroundColor = signalGreen
					}
				}
				
				var ddd2 = document.getElementById("time" + (j + 1) + destkey);
				if (ddd2) {
					ddd2.innerHTML = arr.tl[j]; 
				}			
				var ddd3 = document.getElementById("clip"+(j+1)+destkey);

				var ddd4=document.getElementById("date"+(j+1)+destkey);

			}
		}
		else {
			ggg.style.backgroundColor="#FF0000";
			ggg.style.color="#FFFFFF";
			ggg.innerHTML="Нет связи " + arr.timeout.toFixed(0) + " сек.";

			for (j = 0; j < 16; j++) {
				var ddd = document.getElementById("status" + (j + 1) + destkey);
				if (ddd) {
					ddd.innerHTML = "timeout";

					ddd.style.color = "#FFFFFF";
				}
				else {
					break;
				}

	 } 
		
		//console.log(arr);
		if(arr.sd) {
			//console.log(arr.sd);
			var sdArr = JSON.parse(arr.sd)
			//console.log(sdArr);
			for (cnum in sdArr) {
				var val = sdArr[cnum]; // channel #
				var sdata = JSON.parse(val);
				//console.log(val);
				//console.log(val);
					
				for (sVar in sdata) {
					noError = true;
					var dVal = sdata[sVar]; // data for today/tomorrow schedules
					var sres = JSON.parse(dVal);
					var elKey = "sched" + cnum + sVar + destkey;
					//console.log(elKey);
					 var sEl = document.getElementById(elKey);
					//console.log(sEl);
					if (sEl) {
						var text = ""
						if(sVar == 0) {
							text = "Сегодня: ";
						}
						else {
							text = "Завтра: ";
						}

						if(sres.impres) {
							//console.log(sres.impres);

									text = text + "OK";

								}
								else {
									text = text + "Ошибка " + resData[0].inf;
									sEl.style.backgroundColor = signalRed;
								//}
							}
						}
						else { // nodata about imported schedule
							text = text + "Нет данных";
							if(sVar == 0) { // it's emergency for today and warning for tomorrow
								sEl.style.backgroundColor = signalRed;
							}
							else {
								sEl.style.backgroundColor = signalYellow;
							}
						}
						sEl.innerHTML = text;
					}
				}
			}
			
		}
	}
}

var xmlAllAnchors = null;
var allAnchors = []; // array of anchor for all channels
function loadAllAnchors(url) {
	if (xmlAllAnchors == null) {
		if (window.XMLHttpRequest) {
			xmlAllAnchors = new XMLHttpRequest();
		}
		else {
			xmlAllAnchors = new ActiveXObject("Microsoft.XMLHTTP");
		}
	}

	xmlAllAnchors.onreadystatechange = function() {
		//console.log("xmlAllAnchors" + xmlAllAnchors.readyState);
		if ((xmlAllAnchors.readyState == 4) && (xmlAllAnchors.status==200)) {
			allAnchors = [];
			var arr = xmlAllAnchors.response;
			if(arr == null) return;
			for (j = 1; j <= 4; j++) {
				var items = [];
				//console.log(j);
				var anchors = arr[j];
				if (anchors) {
					var jsonData = JSON.parse(anchors);
					for (var i = 0; i < jsonData.length; i++) {
						var item = [];
						//item = jsonData[i].s_name;
						item.name = jsonData[i].s_name;
						var tm = jsonData[i].s_start.split('.');
						item.start = tm[0];
						
						items[i] = item;
					}
				}
				allAnchors[j] = items;
			}
			//console.log(allAnchors);
		} 
	};

	xmlAllAnchors.open("GET", url, true);
	xmlAllAnchors.setRequestHeader("Cache-Control", "no-cache"); 
	xmlAllAnchors.responseType='json';
	xmlAllAnchors.send("");

var xmlEventsInfo = null;

function loadLastEventsInfo(url) {
	//console.log(url);
	
	if (xmlEventsInfo == null) {
		if (window.XMLHttpRequest) {
			xmlEventsInfo = new XMLHttpRequest();
		}
		else {
			xmlEventsInfo = new ActiveXObject("Microsoft.XMLHTTP");
		}
	}

	xmlEventsInfo.onreadystatechange = function() {
		//console.log("xmlAllAnchors" + xmlAllAnchors.readyState);
		if ((xmlEventsInfo.readyState == 4) && (xmlEventsInfo.status==200)) {
			
			var arr = xmlEventsInfo.response;
			if(arr == null) return;
			//console.log(arr);
			//return;
			
			for(chanNum in arr) {
				var charr = arr[chanNum];
				//console.log(chanNum);
				//console.log(charr);
				//console.log(barr.length);
				
				for(dKey in charr) {
					var blocks = charr[dKey];
					//allBlocks[chanNum] = [];
					//console.log(blocks);
					
					var blockArr = JSON.parse(blocks)
					//console.log(blockArr);
					
					if((blockArr != null) && (blockArr.length)) {
						for (var i = 0; i < blockArr.length; i++) {
							var block = blockArr[i];
							//console.log(chanNum);
							//console.log(dKey);
							//console.log(block)
							var logTime    = block.lt;
							var schedTime  = block.st.substring(0, 8);
							var actionCode = block.ac;
							
							if((actionCode == acBlockStarted) || (actionCode == acBlockStartedWeb)) {
								// global cell
								var marker = "d_" + chanNum + "_" + schedTime;
								//console.log(marker);
								var divEl = document.getElementById(marker);
								if(divEl) {
									divEl.style.fontWeight = "bold";
									divEl.style.color = "green";
								}
								
								// channel cell 
								marker = "d_" + dKey +"_"+ chanNum+"_" + schedTime;
								//console.log(marker);
								divEl = document.getElementById(marker);
								if(divEl) {
									divEl.style.fontWeight = "bold";
									divEl.style.color = "green";
								}
							}
							else if ((actionCode == acStopPalyback) || (actionCode == acStopAnchorTriggered)) { // clear all blocks
								// global cell
								var marker = "ch"+ chanNum + "allblocks";
								//console.log(marker);
								var divEl = document.getElementById(marker);
								if(divEl) {
									var c = divEl.childNodes;
									for(var i=0;i<c.length;i++) {
										//console.log(c[i]);
										c[i].style.fontWeight = "normal";
										c[i].style.color = "black";
									}
								}
								
								// station cell
								marker = "b" + chanNum + "_"  + dKey;
								//console.log(marker);
								divEl = document.getElementById(marker);
								if(divEl) {
									var c = divEl.childNodes;
									for(var i=0;i<c.length;i++) {
										//console.log(c[i]);
										c[i].style.fontWeight = "normal";
										c[i].style.color = "black";
									}
								}
							}
						}
					}
				}
			}
		} 
	};

	xmlEventsInfo.open("GET", url, true);
	xmlEventsInfo.setRequestHeader("Cache-Control", "no-cache"); 
	xmlEventsInfo.responseType='json';
	xmlEventsInfo.send("");  
}

var xmlBlockInfo = null;
var allBlocks = [];

function loadBlocksInfo(url) {
	//console.log(url);
	if (xmlBlockInfo == null) {
		if (window.XMLHttpRequest) {
			xmlBlockInfo = new XMLHttpRequest();
		}
		else {
			xmlBlockInfo = new ActiveXObject("Microsoft.XMLHTTP");
		}
	}

	xmlBlockInfo.onreadystatechange = function() {
		//console.log("xmlAllAnchors" + xmlAllAnchors.readyState);
		if ((xmlBlockInfo.readyState == 4) && (xmlBlockInfo.status==200)) {
			
			var arr = xmlBlockInfo.response;
			if(arr == null) return;
			//console.log(arr);
			for (var i = 1; i < 4; i++) {
				allBlocks[i] = [];
			}
			
			for(dKey in arr) {
				var charr = arr[dKey];
				//console.log(dKey);
				//console.log(charr);
				//console.log(barr.length);
				
				for(chanNum in charr) {
					var blocks = charr[chanNum];
					//allBlocks[chanNum] = [];
					//console.log(chanNum);
					
					var blockArr = JSON.parse(blocks)
					//console.log(blockArr);
					
					if((blockArr != null) && (blockArr.length)) {
						for (var i = 0; i < blockArr.length; i++) {
							var block = blockArr[i];
							var startTime = block.s_start.substring(0, 8);
							var blockName = block.s_name.substring(0, 15);

							// looking for time
							var found = false
							//console.log(allBlocks[chanNum].length);
							for(var j = 0; j < allBlocks[chanNum].length; j++) {
								//console.log(allBlocks[chanNum][j].time);
								if(allBlocks[chanNum][j].time == startTime) {
									found = true;
									break;
								}
							}
							if(!found) {
								var anchorToAdd = {};
								anchorToAdd["time"] = startTime;
								anchorToAdd["name"] = blockName;
								//console.log(startTime);
								allBlocks[chanNum].push(anchorToAdd);
							}
						}
					}
				}
			}

			//console.log(allBlocks);
			for (var i = 1; i < 4; i++) {
				allBlocks[i].sort(function (a, b) {
					var at = (parseInt(a.time.substring(0, 2), 10) * 60 + parseInt(a.time.substring(3, 5), 10)) * 60 + parseInt(a.time.substring(6, 8), 10);
					var bt = (parseInt(b.time.substring(0, 2), 10) * 60 + parseInt(b.time.substring(3, 5), 10)) * 60 + parseInt(b.time.substring(6, 8), 10);
					
					if (at > bt) {
						return 1;
					}
					if (at < bt) {
						return -1;
					}
					return 0;
				});
			}
			//console.log(allBlocks);
			
			// populate ALL ANCHORS cells
			for (var i = 1; i < 4; i++) {
				for(var k = 0; k < allBlocks[i].length; k++) {
					var allBlockCell = document.getElementById("ch" + i + "allblocks");
					if(allBlockCell) {
						//var cell = elRow.cells[chanNum];
						//console.log(cell);
						var startBlockTime = allBlocks[i][k].time;
						var startBlockName = allBlocks[i][k].name;
						
						var marker = i + "_" + startBlockTime;
						var divBegin = "<div id=\"d_" + marker + "\">";
						//console.log(divBegin);
						
						//allBlockCell.innerHTML = allBlockCell.innerHTML + "<div>" + startTime + ": " + blockName +
						allBlockCell.innerHTML = allBlockCell.innerHTML + divBegin + startBlockTime + ": " + startBlockName +
						"<input type=\"button\" value=\"Старт\" OnClick=\"launchBlock(" + i + ",'" + startBlockTime + "'," + "0" + ")\"></input></div>";
					}
				}
			}
			
			// populate stations' block cells
			//console.log(arr);
			for(dKey in arr) {
				var charr = arr[dKey];
				//console.log(dKey);
				//console.log(charr);
				//console.log(barr.length);
				
				for(chanNum in charr) {
					var blocks = charr[chanNum];
					//allBlocks[chanNum] = [];
					//console.log(chanNum);
					//console.log(blocks);
					
					var blockArr = JSON.parse(blocks)
					//console.log(blockArr);
					
					if((blockArr != null) && (blockArr.length)) {
						for(var j = 0; j < allBlocks[chanNum].length; j++) {
							//console.log(allBlocks[chanNum][j].time);
							var curStartTime = allBlocks[chanNum][j].time.substring(0, 8);
							var curBlockName = allBlocks[chanNum][j].name.substring(0, 15);
							for (var i = 0; i < blockArr.length; i++) {
								var block = blockArr[i];
								var cst = block.s_start.substring(0, 8);
								//console.log("startTime: " + cst);
								
								// looking for time
								var found = false
								//console.log(allBlocks[chanNum].length);
								if(allBlocks[chanNum][j].time == cst) {
									found = true;
									break;
								}
							}
							//console.log(found);
							if(found) {
							 // add full line
								var elRow = document.getElementById(dKey);
								if(elRow) {
									var cell = elRow.cells[chanNum];

									var marker = dKey +"_"+ chanNum+"_"+ curStartTime;
									var divBegin = "<div id=\"d_" + marker + "\">";
									//console.log(divBegin);
									var disableCheckButton = "<input type=\"checkbox\" OnClick=switchLaunchButton(\"" + dKey +"\","+ chanNum+",\""+ curStartTime+"\") value=\"\">Игнор</input>"
									var startButton = "<input type=\"button\" value=\"Старт\" id=\"" + marker + 
									"\" OnClick=launchBlockAtStation(\"" + dKey +"\","+ chanNum+",\""+ curStartTime+"\",0)></input>";
									cell.innerHTML = cell.innerHTML + divBegin + curStartTime + ": " + curBlockName + disableCheckButton
									 + startButton + "</div>";
								}
							}
							else {
							 // add empty line for this time
								var elRow = document.getElementById(dKey);
								if(elRow) {
									var cell = elRow.cells[chanNum];
									cell.innerHTML = cell.innerHTML + "<div>" + curStartTime + ": —</div>";
								}
							}
						}
					}
				}
			}
		} 
	};

	xmlBlockInfo.open("GET", url, true);
	xmlBlockInfo.setRequestHeader("Cache-Control", "no-cache"); 
	xmlBlockInfo.responseType='json';
	xmlBlockInfo.send("");  
}
