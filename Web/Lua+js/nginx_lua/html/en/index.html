function PostURL(url, bodyvalue) {
	console.log("url: " + url);
	if (xmlpost == null) {
		if (window.XMLHttpRequest) {
			xmlpost = new XMLHttpRequest(); 
		}
		else{
			xmlpost = new ActiveXObject("Microsoft.XMLHTTP");
		}
	}
	xmlpost.open("POST", url, false);
	xmlpost.setRequestHeader("Content-Type", "text/plain");
	xmlpost.send(bodyvalue);
}

function loadXMLDoc(url) {

	var channels = arr.chs;
	if(channels) {
		var jsonData = JSON.parse(channels);
		for (var i = 0; i < jsonData.length; i++) {

	 var sStName = document.getElementById("stname" + destkey);
	 if (sStName) {
		if(arr.stname == null) {
	   sStName.innerHTML = "(undefined)"; 
		}
		else {
	   sStName.innerHTML = arr.stname; 
		 }
	 }

	 var ggg2 = document.getElementById("fs" + destkey);
	 if (ggg2) {
		if(arr.stname == null) {
			ggg2.innerHTML = ""; 
		}
		else {
			ggg2.innerHTML = arr.fs + " свободно"; 
		}
	 }

   var ggg = document.getElementById("status" + destkey);
	 if (ggg) {
		if (arr.p != "timeout") {
			ggg.innerHTML="To download: "+arr.p+"Mb   CPU:" + arr.CPU; 
			ggg.style.backgroundColor="#C0F0F0";
			ggg.style.color="#000000";

			for (j = 0; j < arr.s.length; j++) {
				var ddd = document.getElementById("status" + (j + 1) + destkey);
				if (ddd) {
					ddd.innerHTML = arr.s[j];
					//ddd.innerHTML = "1"; 
					ddd.style.color = "#000000";
					<!-- if (arr.s[j] == "0") -->
						<!-- ddd.style.backgroundColor = "#C0F0F0"; -->
					<!-- else -->
						<!-- ddd.style.backgroundColor = "#00FF00"; -->
					var pd = ddd.parentElement;
					if (pd) {
						if(arr.siglvl) {
							if(arr.siglvl[j] == 100) {
								pd.style.backgroundColor = signalGreen;
							}
							else if ((arr.siglvl[j] < 100) && (arr.siglvl[j] >= 50)) {
								pd.style.backgroundColor = signalYellow;
							}
							else {
								pd.style.backgroundColor = signalRed;
							}
						}
						else {
							pd.style.backgroundColor = signalRed;
						}
						//pd.innerHTML = "as";
						//pd.style.backgroundColor = signalGreen
					}
				}
				
				var ddd2 = document.getElementById("time" + (j + 1) + destkey);
				if (ddd2) {
					ddd2.innerHTML = arr.tl[j]; 
				}			
				var ddd3 = document.getElementById("clip"+(j+1)+destkey);
				if (ddd3) {
					ddd3.innerHTML=arr.cp[j]; 
				}			
				var ddd4=document.getElementById("date"+(j+1)+destkey);
				if (ddd4) {
					var d=new Date();
					d.setTime(1000 * Number(arr.tm[j]));
					ddd4.innerHTML = d.toDateString(); 
				}			
			}
		}
		else {
			ggg.style.backgroundColor="#FF0000";
			ggg.style.color="#FFFFFF";
			ggg.innerHTML="Нет связи " + arr.timeout.toFixed(0) + " s.";

			for (j = 0; j < 16; j++) {
				var ddd = document.getElementById("status" + (j + 1) + destkey);
				if (ddd) {
					ddd.innerHTML = "timeout"; 
					ddd.style.backgroundColor = "#FF0000";
					ddd.style.color = "#FFFFFF";
				}
				else {
					break;
				}
			}
		}
	 }

}

function loadXMLSettings(url) {
	if (xmlhttpsettings == null) {
		if (window.XMLHttpRequest) {
			xmlhttpsettings = new XMLHttpRequest();
		}
		else {
			xmlhttpsettings = new ActiveXObject("Microsoft.XMLHTTP");
		}
	}

	xmlhttpsettings.onreadystatechange = function() {
		if ((xmlhttpsettings.readyState == 4) && (xmlhttpsettings.status==200)) { 
			var arr = xmlhttpsettings.response; 
			if(arr == null) return;
			var channels = arr.chs;
			if (channels) {
				var jsonData = JSON.parse(channels);
				for (var i = 0; i < jsonData.length; i++) {
					var val = jsonData[i];
					//console.log("id:" + val.id + ", title:" + val.title);
					var sCh = document.getElementById("ch" + val.id + "title");
					if (sCh) {
						//sCh.innerHTML = val.title; 
						sCh.innerHTML = "<a href=\"/channel/?" + val.id + "\">" + val.title + "</a>"
					}
				}
			}
		} 
	};

	xmlhttpsettings.open("GET", url, true);
	xmlhttpsettings.setRequestHeader("Cache-Control", "no-cache"); 
	xmlhttpsettings.responseType='json';
	xmlhttpsettings.send("");  
}

// pull all anchors for parsing (for "start anchor" button)
var xmlAllAnchors = null;
var allAnchors = []; // array of anchor for all channels
function loadAllAnchors(url) {
	if (xmlAllAnchors == null) {
		if (window.XMLHttpRequest) {
			xmlAllAnchors = new XMLHttpRequest();
		}
		else {
			xmlAllAnchors = new ActiveXObject("Microsoft.XMLHTTP");
		}
	}

	xmlAllAnchors.onreadystatechange = function() {
		//console.log("xmlAllAnchors" + xmlAllAnchors.readyState);
		if ((xmlAllAnchors.readyState == 4) && (xmlAllAnchors.status==200)) {
			allAnchors = [];
			var arr = xmlAllAnchors.response;
			if(arr == null) return;
			for (j = 1; j <= 4; j++) {
				var items = [];
				//console.log(j);
				var anchors = arr[j];
				if (anchors) {
					var jsonData = JSON.parse(anchors);
					for (var i = 0; i < jsonData.length; i++) {
						var item = [];
						//item = jsonData[i].s_name;
						item.name = jsonData[i].s_name;
						var tm = jsonData[i].s_start.split('.');
						item.start = tm[0];
						
						items[i] = item;
					}
				}
				allAnchors[j] = items;
			}
			//console.log(allAnchors);
		} 
	};

	xmlAllAnchors.open("GET", url, true);
	xmlAllAnchors.setRequestHeader("Cache-Control", "no-cache"); 
	xmlAllAnchors.responseType='json';
	xmlAllAnchors.send("");  
}

function CloneStatusTable() {
